<!doctype html>
<!-- Serve this folder (npx serve, python3 -m http.server) and open example.html: browsers don't run modules from file://. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aura example</title>
  <style>
    body {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 16px 48px;
      background: #05080c;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h2 { margin: 36px 0 14px; font-size: 15px; font-weight: 500; opacity: 0.6; }
    p, a { color: rgb(255 255 255 / 55%); font-size: 13px; }
    #load { width: 200px; }
  </style>
</head>
<body>
  <h2>The weather in Berlin</h2>
  <aura-board editable persist="example">
    <aura-tile metric="temperature" span="2"></aura-tile>
    <aura-tile metric="wind"></aura-tile>
    <aura-tile metric="humidity"></aura-tile>
    <aura-tile metric="air"></aura-tile>
    <aura-tile metric="uv-day" span="2"></aura-tile>
    <aura-tile metric="rain"></aura-tile>
  </aura-board>
  <p>Hold a tile or press Edit to move, widen or hide it. <a href="https://open-meteo.com/">Weather data by Open-Meteo.com</a></p>

  <h2>Your own numbers</h2>
  <aura-tile id="load" kind="ruler" label="Server load" sublabel="Last 30 seconds"
             unit="%" min="0" max="100" tone="percent" alert="85"></aura-tile>

  <script type="module">
    import { bindWeather } from "./aura.js";

    bindWeather(document.querySelector("aura-board"), { place: "Berlin" });

    // a new reading every second; the ruler keeps the last 30, and the newest is the number
    const load = document.getElementById("load");
    const series = Array.from({ length: 30 }, (_, i) => Math.round(55 + 12 * Math.sin(i / 3)));
    const times = series.map((_, i) => (i === 29 ? "now" : `−${29 - i} s`));
    load.data = { series: [...series], times, at: 29 };

    setInterval(() => {
      const last = series[29];
      const next = last + (55 - last) * 0.08 + (Math.random() - 0.5) * 16; // wanders round 55, now and then past 85
      series.push(Math.round(Math.min(100, Math.max(0, next))));
      series.shift();
      load.update({ series: [...series] });
    }, 1000);
  </script>
</body>
</html>
